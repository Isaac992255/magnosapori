<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magno Sapori - Panel de Administración</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <!-- ==================== LOGIN PAGE ==================== -->
  <div id="loginPage" class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">☕</div>
        <h1 class="login-title">Magno Sapori</h1>
        <p class="login-subtitle">Panel de Administración</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="admin@magnosapori.com"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••"
            required
          >
        </div>
        
        <button type="submit" class="btn btn-primary" id="loginBtn">
          Iniciar Sesión
        </button>
        
        <div id="loginError" class="error-message hidden"></div>
      </form>
    </div>
  </div>

  <!-- ==================== DASHBOARD =================== -->
  <div id="dashboardPage" class="dashboard hidden">
    <header class="dashboard-header">
      <div class="dashboard-title">
        <span>☕</span>
        <span>Magno Sapori</span>
      </div>
      <div class="dashboard-actions">
        <span id="userEmail" style="color:#6b7280;font-size:13px;margin-right:8px;"></span>
        <button class="btn btn-secondary" id="logoutBtn">Cerrar Sesión</button>
      </div>
    </header>

    <main class="dashboard-content">
      <div class="section-header">
        <h2 class="section-title">Gestión de Menú</h2>
        <div style='display:flex;gap:8px;'>
          <a class='btn btn-primary' href='/admin/tv-menu-editor' style='text-decoration:none;font-size:14px;'>📺 Editor Menú TV</a>
          <a class='btn btn-primary' href='/tv-cafeteria/' style='text-decoration:none;font-size:14px;'>☕ Menú TV Cafetería</a>
        </div>
      </div>

      <div id="loadingState" class="loading">
        <div class="spinner"></div>
      </div>
      <div id="categoriesContainer" class="categories-grid hidden"></div>
    </main>
  </div>

  <!-- Modal para agregar ítem -->
  <div id="addItemModal" class="modal hidden">
    <div class="modal-overlay" onclick="closeAddItemModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Agregar nuevo ítem</h3>
        <button class="modal-close" onclick="closeAddItemModal()">&times;</button>
      </div>
      <form id="addItemForm" class="modal-form">
        <div class="form-group">
          <label for="itemName" class="form-label">Nombre *</label>
          <input 
            type="text" 
            id="itemName" 
            class="form-input" 
            placeholder="Ej: Café con leche"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="itemDescription" class="form-label">Descripción (opcional)</label>
          <textarea 
            id="itemDescription" 
            class="form-input form-textarea" 
            placeholder="Ej: Café caliente con leche espumada"
            rows="3"
          ></textarea>
        </div>
        
        <div class="form-group">
          <label for="itemPrice" class="form-label">Precio *</label>
          <input 
            type="number" 
            id="itemPrice" 
            class="form-input" 
            placeholder="9999"
            min="0"
            step="0.01"
            required
          >
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeAddItemModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="addItemSubmitBtn">Agregar ítem</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- API Client & Scripts -->
  <script src="api-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
